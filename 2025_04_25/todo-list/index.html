<!DOCTYPE html>
<html lang="en">

<head>

                </label>
                <label>
                    <li class="afternoon"><input type="checkbox">Đi thực hành lập trình Script</li>
                </label>

                </label>

                </label>
                <label>
                    <li class="afternoon"><input type="checkbox">Đi đá bóng</li>
                </label>
                <label>
                    <li class="evening"><input type="checkbox">Học môn Cơ sở dữ liệu</li>
                </label>
            </ul>
        </div>
        <p data-type="reminder"><i>Ghi nhớ: Kỷ luật là sức mạnh !</i></p>
    </div>
</body>

</html>
