<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Movie</title>
    <link rel="stylesheet" href="/style/admin_movie.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="flex h-screen bg-gray-100">
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Admin Movie</h2>
        <ul>
            <li class="active">Movies</li>
            <a href="/admin_theater"><li>Theaters</li></a>
            <a href="/admin_user"><li>Users</li></a>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">    
            <div class="user-info">
                <span class="avatar">a</span>
                <span>Administrator</span>
            </div>
            <button class="create-btn">+ Create new</button>
        </div>

        <!-- Movie Table -->
        <div class="table-container">
            <h3>Search</h3>

            <input type="text" id="searchInput" placeholder="Search theater by name..." class="search-bar" />

            <table id="movieTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Cover</th>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td><img src="https://via.placeholder.com/100x150" alt="Movie Cover" class="cover-img"></td>
                        <td>Title</td>
                        <td>Status</td>
                        <td>
                            <i class="fas fa-eye action-btn"></i>
                            <i class="fas fa-trash action-btn"></i>
                        </td>
                    </tr>
                    
                    
                    <!-- Modal View Movie -->
                    <div id="movieModal" class="modal" style="display: none;">
                        <div class="modal-content">
                            <span class="close-btn">&times;</span>
                            <h2>Movie Details</h2>
                            <form>
                                <label>Title:</label>
                                <input type="text" id="view-title" readonly><br>
                                <label>Description:</label>
                                <textarea id="view-description" readonly></textarea><br>
                                <label>Duration:</label>
                                <input type="text" id="view-duration" readonly><br>
                                <label>Genre:</label>
                                <input type="text" id="view-genre" readonly><br>
                                <label>Image URL:</label>
                                <input type="text" id="view-image" readonly><br>
                            </form>
                        </div>
                    </div>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
        const tableBody = document.querySelector('tbody');
        const createBtn = document.querySelector('.create-btn');

        // Fetch and display movies
        async function loadMovies() {
            try {
                const response = await fetch('/api/movies');
                const movies = await response.json();
                
                // Clear existing table content
                tableBody.innerHTML = '';

                // Populate table with movie data
                movies.forEach((movie, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td><img src="${movie.image_url}" alt="${movie.title}" class="cover-img"></td>
                        <td>${movie.title}</td>
                        <td>Active</td>
                        <td>
                            <i class="fas fa-eye action-btn" data-id="${movie.movie_id}" data-action="view"></i>
                            <i class="fas fa-trash action-btn" data-id="${movie.movie_id}" data-action="delete"></i>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

                // Add event listeners for action buttons
                document.querySelectorAll('.action-btn').forEach(btn => {
                    btn.addEventListener('click', handleAction);
                });
            } catch (error) {
                console.error('Error loading movies:', error);
                alert('Failed to load movies');
            }
        }

        // Handle view and delete actions
        async function handleAction(event) {
            const movieId = event.target.dataset.id;
            const action = event.target.dataset.action;

            if (action === 'view') {
                 try {
                    const response = await fetch(`/api/movies/${movieId}`);
                    const movie = await response.json();

                    if (response.ok) {
                        // Hiển thị dữ liệu vào modal
                        document.getElementById('view-title').value = movie.title;
                        document.getElementById('view-description').value = movie.description;
                        document.getElementById('view-duration').value = movie.duration_minutes + " minutes";
                        document.getElementById('view-genre').value = movie.genre;
                        document.getElementById('view-image').value = movie.image_url;
                        document.getElementById('movieModal').style.display = 'flex';
                    } else {
                        alert('Movie not found');
                    }
                } catch (error) {
                    console.error('Error viewing movie:', error);
                    alert('Failed to view movie');
                }
            } else if (action === 'delete') {
                if (confirm('Are you sure you want to delete this movie?')) {
                    try {
                        const response = await fetch(`/api/movies/${movieId}`, {
                            method: 'DELETE'
                        });
                        const result = await response.json();
                        
                        if (response.ok) {
                            alert(result.message);
                            loadMovies(); // Refresh the table
                        } else {
                            alert(result.error);
                        }
                    } catch (error) {
                        console.error('Error deleting movie:', error);
                        alert('Failed to delete movie');
                    }
                }
            }
        }

        // Handle create new movie
        createBtn.addEventListener('click', () => {
            // Create a simple form in a modal
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h2>Add New Movie</h2>
                    <span class="close-btn">&times;</span>
                    <form id="create-movie-form">
                        <input type="text" id="title" placeholder="Title" required>
                        <textarea id="description" placeholder="Description" required></textarea>
                        <input type="number" id="duration_minutes" placeholder="Duration (minutes)" required>
                        <input type="text" id="genre" placeholder="Genre" required>
                        <input type="text" id="image_url" placeholder="Image URL" required>
                        <button type="submit">Save</button>
                        <button type="button" class="cancel-btn">Cancel</button>
                    </form>
                </div>
            `;
            document.body.appendChild(modal);

            // Add styles for modal
            const style = document.createElement('style');
            style.textContent = `
                .modal {
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0,0,0,0.5);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 1000;
                }
                .modal-content {
                    background: white;
                    padding: 20px;
                    border-radius: 5px;
                    width: 400px;
                }
                .modal-content input,
                .modal-content textarea {
                    width: 100%;
                    margin: 10px 0;
                    padding: 8px;
                    border: 1px solid #ddd;
                    border-radius: 4px;
                }
                .modal-content button {
                    padding: 8px 16px;
                    margin: 10px 5px;
                    border: none;
                    border-radius: 4px;
                    cursor: pointer;
                }
                .modal-content button[type="submit"] {
                    background: #4CAF50;
                    color: white;
                }
                .cancel-btn {
                    background: #f44336;
                    color: white;
                }
            `;
            document.head.appendChild(style);

            // Handle form submission
            const form = modal.querySelector('#create-movie-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const movieData = {
                    title: form.querySelector('#title').value,
                    description: form.querySelector('#description').value,
                    duration_minutes: parseInt(form.querySelector('#duration_minutes').value),
                    genre: form.querySelector('#genre').value,
                    image_url: form.querySelector('#image_url').value
                };

                try {
                    const response = await fetch('/api/movies', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(movieData)
                    });
                    const result = await response.json();
                    
                    if (response.ok) {
                        alert(result.message);
                        document.body.removeChild(modal);
                        loadMovies(); // Refresh the table
                    } else {
                        alert(result.error);
                    }
                } catch (error) {
                    console.error('Error creating movie:', error);
                    alert('Failed to create movie');
                }
            });

            modal.querySelector(".close-btn").addEventListener('click', () => {
                document.body.removeChild(modal);
            });

            // Handle cancel button
            modal.querySelector('.cancel-btn').addEventListener('click', () => {
                document.body.removeChild(modal);
            });
        });

        // Đóng modal view
        document.querySelector('#movieModal .close-btn').addEventListener('click', () => {
            document.getElementById('movieModal').style.display = 'none';
        });

        // Tìm kiếm
            document.getElementById("searchInput").addEventListener("input", function () {
                const keyword = this.value.toLowerCase();
                document.querySelectorAll("#movieTable tbody tr").forEach(row => {
                    const name = row.children[2].textContent.toLowerCase();
                    row.style.display = name.includes(keyword) ? "" : "none";
                });
            });

        // Initial load of movies
        loadMovies();
    });
    </script>
</body>
</html>
