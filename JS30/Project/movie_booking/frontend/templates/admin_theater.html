<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Theater</title>
    <link rel="stylesheet" href="/style/admin_theater.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="flex h-screen bg-gray-100">
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Admin Theater</h2>
        <ul>
            <a href="/admin_movie"><li>Movies</li></a>
            <li class="active">Theaters</li>
            <li>Users</li>
            <li>Orders</li>
            <li>Report</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <div class="user-info">
                <span class="avatar">a</span>
                <span>administrator</span>
            </div>
            <button class="create-btn">+ Create new</button>
        </div>

        <!-- Theater Table -->
        <div class="table-container">
            <h3>Theater</h3>

            <input type="text" id="searchInput" placeholder="Search theater by name..." class="search-bar" />

            <table id="theaterTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </div>

        <!-- Modal -->
        <div id="theaterModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2>Theater Details</h2>
                <form id="modal-form">
                    <label>ID:</label>
                    <input type="text" id="modal-id" readonly><br>

                    <label>Name:</label>
                    <input type="text" id="modal-name"><br>

                    <label>Address:</label>
                    <input type="text" id="modal-address"><br>

                    <label>City:</label>
                    <input type="text" id="modal-city"><br>

                    <label>Status:</label>
                    <select id="modal-status">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select><br>

                    <label>Seat Counts:</label>
                    <input type="number" id="modal-seats"><br>

                    <div style="display: flex; justify-content: flex-end; gap: 10px;">
                        <button type="button" class="cancel-btn">Cancel</button>
                        <button type="submit" class="save-btn">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        async function loadTheaters() {
            const response = await fetch('/api/theaters');
            const theaters = await response.json();
            const tbody = document.querySelector('#theaterTable tbody');
            tbody.innerHTML = ""; // Clear old data

            theaters.forEach((theater, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${theater.name}</td>
                    <td>${theater.status}</td>
                    <td>
                        <i class="fas fa-eye action-btn"
                            data-id="${theater.theater_id}"
                            data-name="${theater.name}"
                            data-address="${theater.address}"
                            data-city="${theater.city}"
                            data-status="${theater.status}"
                            data-seats="${theater.seat_count}">
                        </i>
                    </td>
                `;
                tbody.appendChild(row);
            });

            // Gắn sự kiện mở modal khi click 👁️
            document.querySelectorAll('.action-btn').forEach(button => {
                button.addEventListener('click', function () {
                    document.getElementById('modal-id').value = this.dataset.id;
                    document.getElementById('modal-name').value = this.dataset.name;
                    document.getElementById('modal-address').value = this.dataset.address;
                    document.getElementById('modal-city').value = this.dataset.city;
                    document.getElementById('modal-status').value = this.dataset.status;
                    document.getElementById('modal-seats').value = this.dataset.seats;
                    document.getElementById('theaterModal').style.display = 'flex';
                });
            });
        }

        // Đóng modal
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('.close-btn').addEventListener('click', () => {
                document.getElementById('theaterModal').style.display = 'none';
            });

            document.querySelector('.cancel-btn').addEventListener('click', () => {
                document.getElementById('theaterModal').style.display = 'none';
            });

            // Gửi PUT khi Save
            document.getElementById('modal-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                const id = document.getElementById('modal-id').value;
                const data = {
                    name: document.getElementById('modal-name').value,
                    address: document.getElementById('modal-address').value,
                    city: document.getElementById('modal-city').value,
                    status: document.getElementById('modal-status').value,
                    seat_count: parseInt(document.getElementById('modal-seats').value)
                };

                const res = await fetch(`/api/theaters/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    document.getElementById('theaterModal').style.display = 'none';
                    loadTheaters();
                } else {
                    alert('Update failed');
                }
            });

            // Tìm kiếm
            document.getElementById("searchInput").addEventListener("input", function () {
                const keyword = this.value.toLowerCase();
                document.querySelectorAll("#theaterTable tbody tr").forEach(row => {
                    const name = row.children[1].textContent.toLowerCase();
                    row.style.display = name.includes(keyword) ? "" : "none";
                });
            });
        });

        // Tải dữ liệu
        window.onload = loadTheaters;
    </script>
</body>
</html>
