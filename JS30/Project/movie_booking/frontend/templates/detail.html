<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../style/detail.css">
    <title>Movie Ticket Booking Detail</title>
</head>

<body>
    <div class="container">
        <div class="order-detail">Order detail</div>
        <h2>Booking Detail</h2>

        <div class="detail-section">
            <h3>Schedule</h3>
            <div class="detail-item"><span>Movie Title</span><span id="movie-name"></span></div>
            <div class="detail-item"><span>Date</span><span id="date-display"></span></div>
            <div class="detail-item"><span>Ticket</span><span id="seat-display"></span></div>
            <div class="detail-item"><span>Hours</span><span id="time-display"></span></div>
        </div>

        <div class="detail-section transaction-detail">
            <h3>Transaction Detail</h3>
            <div class="detail-item"><span>REGULAR SEAT</span><span id="regular-seat"></span></div>
            <div class="detail-item"><span>Service Charge (6%)</span><span id="service-charge"></span></div>
            <div class="total-payment"><span>Total Payment </span><span id="total-payment"></span></div>
        </div>

        <div class="purchased-note">*Purchased ticket cannot be canceled</div>
        <a href="#" class="checkout-btn" id="btn">Checkout Ticket</a>
    </div>

    <script>
        // Lấy thông tin từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const theater = urlParams.get('theater');
        const date = urlParams.get('date');
        const time = urlParams.get('time');
        const movie = urlParams.get('movie');
        const image = urlParams.get('image');
        const seats = urlParams.get('seats');
        const total = parseFloat(urlParams.get('total'));

        // Hiển thị thông tin
        document.getElementById('movie-name').textContent = movie.replace(/([A-Z])/g, ' $1').trim();
        document.getElementById('date-display').textContent = date;
        document.getElementById('seat-display').textContent = seats;
        document.getElementById('time-display').textContent = time;

        // Tính toán chi tiết giao dịch
        const seatCount = seats.split(',').length;
        const regularSeatPrice = 18.95; // Giá gốc từ seat.html
        const regularSeatTotal = (seatCount * regularSeatPrice).toFixed(2);
        const serviceCharge = (regularSeatTotal * 0.06).toFixed(2);
        const grandTotal = (parseFloat(regularSeatTotal) + parseFloat(serviceCharge)).toFixed(2);

        document.getElementById('regular-seat').textContent = `RM ${regularSeatPrice} x ${seatCount}`;
        document.getElementById('service-charge').textContent = `RM ${serviceCharge} x ${seatCount}`;
        document.getElementById('total-payment').textContent = `RM ${grandTotal}`;

        // Kiểm tra tổng tiền
        if (Math.abs(total - parseFloat(grandTotal)) > 0.01) {
            console.warn('Tổng tiền không khớp, có thể do sai lệch giá hoặc service charge!');
        }

        // Xử lý sự kiện khi nhấn nút Checkout
        document.getElementById('btn').addEventListener('click', function () {
            // Lưu thông tin đặt vé vào localStorage
            const bookingDetails = {
                theater: theater,
                date: date,
                time: time,
                movie: movie,
                image: image,
                seats: seats,
                total: grandTotal
            };
            localStorage.setItem('bookingDetails', JSON.stringify(bookingDetails));

            // Chuyển hướng đến trang thanh toán
            window.location.href = 'otp.html';
        });
    </script>
</body>

</html>
