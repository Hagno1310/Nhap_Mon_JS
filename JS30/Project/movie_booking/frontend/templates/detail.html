<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../style/detail.css">
    <title>Movie Ticket Booking Detail</title>
</head>
<body>
    <div class="container">
        <div class="order-detail">Order detail</div>
        <h2>Booking Detail</h2>

        <div class="detail-section">
            <h3>Schedule</h3>
            <div class="detail-item"><span>Movie Title</span> SPIDERMAN NO WAY HOME</div>
            <div class="detail-item"><span>Date</span> Mon, 23 Oct 2023</div>
            <div class="detail-item"><span>Tiket (3)</span> C8, C9, C10</div>
            <div class="detail-item"><span>Hours</span> 14:40</div>
        </div>

        <div class="detail-section transaction-detail">
            <h3>Transaction Detail</h3>
            <div class="detail-item"><span>REGULAR SEAT</span> RM 55.70 x 3</div>
            <div class="detail-item"><span>Service Charge (6%)</span> RM 3.30 x 3</div>
            <div class="total-payment"><span>Total payment</span> RM 62.10</div>
        </div>

        <div class="purchased-note">*Purchased ticket cannot be canceled</div>
        <a href="#" class="checkout-btn">Checkout Ticket</a>
    </div>
</body>
</html>
