<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/style/home.css">
    <title>Movie Ticket Booking</title>
</head>

<style>
    body {
    background-image: url(/images/bg.png.png);
    }
</style>

<body>
    <div class="container">
        <header>
            <div class="logo-container"><a href="./home.html"><img src="/images/logo.png" alt=""></a></div>
            <div class="auth-container">
                <a href="./login" class="login-btn">login</a>
                <a href="./register" class="regis-btn">register</a>
            </div>
        </header>
        <div class="list-film">
            <div class="title">now showing</div>
            <div class="films-menu">
                <div href="./info?movie=Furiosa: A Mad Max Saga&image=/images/film-1.png" class="item">
                    <div class="banner"><img src="/images/film-1.png" alt=""></div>
                    <div class="film-name">Furiosa: A Mad Max Saga</div>
                </div>
                <div href="./info?movie=IF&image=/images/film-2.png" class="item">
                    <div class="banner"><img src="/images/film-2.png" alt=""></div>
                    <div class="film-name">IF</div>
                </div>
                <div href="./info?movie=Civil War&image=/images/film-3.png" class="item">
                    <div class="banner"><img src="/images/film-3.png" alt=""></div>
                    <div class="film-name">Civil War</div>
                </div>
                <div href="./info?movie=Kingdom of the Planet of the Apes&image=/images/film-4.png" class="item">
                    <div class="banner"><img src="/images/film-4.png" alt=""></div>
                    <div class="film-name">Kingdom of the Planet of the Apes</div>
                </div>
                <div href="./info?movie=Dune: Part Two&image=/images/film-5.png" class="item">
                    <div class="banner"><img src="/images/film-5.png" alt=""></div>
                    <div class="film-name">Dune: Part Two</div>
                </div>
                <div href="./info?movie=Sheriff: Narko Integriti&image=/images/film-6.png" class="item">
                    <div class="banner"><img src="/images/film-6.png" alt=""></div>
                    <div class="film-name">Sheriff: Narko Integriti</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //Thông báo cần đăng nhập
        document.querySelector('.item').addEventListener('click', function () {
            alert("You have not login")
            setTimeout(function () {
                window.location.href = "/login";
            }, 2000)
        })

    </script>
</body>

</html>
