<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/style/home.css">
    <title>Movie Ticket Booking</title>
</head>

<style>
    body {
    background-image: url(/images/bg.png.png);
    }
</style>

<body>
    <div class="container">
        <header>
            <div class="logo-container"><a href="./home.html"><img src="/images/logo.png" alt=""></a></div>
            <div class="auth-container">
                <a href="./login" class="login-btn">login</a>
                <a href="./register" class="regis-btn">register</a>
            </div>
        </header>
        <div class="list-film">
            <div class="title">now showing</div>
            <div class="films-menu">
                <!-- Các mục phim sẽ được thêm vào đây thông qua JavaScript -->
            </div>
        </div>
    </div>
    <script>
        //Thông báo cần đăng nhập
        document.querySelector('.films-menu').addEventListener('click', function (e) {
            const item = e.target.closest('.item');
            if (item) {
                const confirmed = confirm('Bạn chưa đăng nhập. Đăng nhập ngay?');
                if (confirmed) {
                    window.location.href = './login';
                }
            }
        });

        // Lấy danh sách phim từ API và hiển thị
        fetch('/api/movies')
            .then(response => response.json())
            .then(data => {
                const filmsMenu = document.querySelector('.films-menu');
                filmsMenu.innerHTML = ''; 

                data.forEach(movie => {
                    const item = document.createElement('div');
                    item.className = 'item';

                    const banner = document.createElement('div');
                    banner.className = 'banner';
                    const img = document.createElement('img');
                    img.src = movie.image_url;
                    img.alt = movie.title || 'Phim không có tiêu đề';
                    banner.appendChild(img);

                    const filmName = document.createElement('div');
                    filmName.className = 'film-name';
                    filmName.textContent = movie.title || 'Không có tiêu đề';

                    item.appendChild(banner);
                    item.appendChild(filmName);
                    filmsMenu.appendChild(item);
                });
            })
            .catch(error => console.error('Error fetching movies:', error));

    </script>
</body>

</html>
