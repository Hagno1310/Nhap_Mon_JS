<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/style/home.css">
    <title>Movie Ticket Booking</title>
</head>

<style>
    body {
        background-image: url(images/bg.png.png);
    }
</style>

<body>
    <div class="container">
        <header>
            <div class="logo-container"><img src="/images/logo.png" alt=""></div>
            <div class="nav-container">
                <a href="/myticket" class="my-ticket">My Ticket</a>
                <a href="/" class="logout-btn">Logout</a>
            </div>
        </header>
        <div class="list-film">
            <div class="title">now showing</div>
            <div class="films-menu">
                <a href="./info?movie=Furiosa: A Mad Max Saga&image=/images/film-1.png" class="item">
                    <div class="banner"><img src="/images/film-1.png" alt=""></div>
                    <div class="film-name">Furiosa: A Mad Max Saga</div>
                </a>
                <a href="./info?movie=IF&image=/images/film-2.png" class="item">
                    <div class="banner"><img src="/images/film-2.png" alt=""></div>
                    <div class="film-name">IF</div>
                </a>
                <a href="./info?movie=Civil War&image=/images/film-3.png" class="item">
                    <div class="banner"><img src="/images/film-3.png" alt=""></div>
                    <div class="film-name">Civil War</div>
                </a>
                <a href="./info?movie=Kingdom of the Planet of the Apes&image=/images/film-4.png" class="item">
                    <div class="banner"><img src="/images/film-4.png" alt=""></div>
                    <div class="film-name">Kingdom of the Planet of the Apes</div>
                </a>
                <a href="./info?movie=Dune: Part Two&image=/images/film-5.png" class="item">
                    <div class="banner"><img src="/images/film-5.png" alt=""></div>
                    <div class="film-name">Dune: Part Two</div>
                </a>
                <a href="./info?movie=Sheriff: Narko Integriti&image=/images/film-6.png" class="item">
                    <div class="banner"><img src="/images/film-6.png" alt=""></div>
                    <div class="film-name">Sheriff: Narko Integriti</div>
                </a>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('pageshow', function (event) {
            if (event.persisted || (window.performance && performance.getEntriesByType("navigation")[0].type === "back_forward")) {
                location.reload(); // Ép tải lại trang
            }
        });
    </script>
</body>

</html>
