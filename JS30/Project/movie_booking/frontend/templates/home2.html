<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/style/home.css">
    <title>Movie Ticket Booking</title>
</head>

<style>
    body {
        background-image: url(images/bg.png.png);
    }
</style>

<body>
    <div class="container">
        <header>
            <div class="logo-container"><img src="/images/logo.png" alt=""></div>
            <div class="nav-container">
                <a href="/myticket" class="my-ticket">My Ticket</a>
                <a href="/" class="logout-btn">Logout</a>
            </div>
        </header>
        <div class="list-film">
            <div class="title">now showing</div>
            <div class="films-menu">
            </div>
        </div>
    </div>

    <script>

        fetch('/api/movies')
            .then(response => response.json())
            .then(data => {
                const filmsMenu = document.querySelector('.films-menu');
                filmsMenu.innerHTML = ''; // Clear existing items

                data.forEach(movie => {
                    const item = document.createElement('a');
                    item.href = `./info?movie=${encodeURIComponent(movie.title)}&image=${encodeURIComponent(movie.image_url)}`;
                    item.className = 'item';

                    const banner = document.createElement('div');
                    banner.className = 'banner';
                    const img = document.createElement('img');
                    img.src = movie.image_url;
                    img.alt = movie.title;
                    banner.appendChild(img);

                    const filmName = document.createElement('div');
                    filmName.className = 'film-name';
                    filmName.textContent = movie.title;

                    item.appendChild(banner);
                    item.appendChild(filmName);
                    filmsMenu.appendChild(item);
                });
            })
            .catch(error => console.error('Error fetching movies:', error));
    </script>
</body>

</html>
