<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,300;1,500;1,600;1,700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/style/login.css">
    <title>Movie Ticket Booking</title>
</head>

<style>
    body {
        background-image: url(/images/bg.png.png);
    }
</style>

<body>
    <div class="container">
        <div class="login-container">
            <div class="title">Login to your account</div>
            <form>
                <label for="">
                    <div class="input-text">Email</div>
                    <input type="email" placeholder="Enter your email" id="email">
                </label>

                <label for="">
                    <div class="input-text">Password</div>
                    <input type="password" placeholder="Enter your password" id="password">
                    <p id="login-successfully" style="color: green; font-size: 14px; font-family: 'Poppins', sans-serif; display: none;">Đăng nhập thành công</p>
                    <p id="wrong-password"
                        style="color: red; font-size: 14px; font-family: 'Poppins', sans-serif; display: none;">Sai mật khẩu. Vui lòng thử lại</p>
                </label>

                <div class="login-btn" id="login-btn">Login Now</div>
                <p class="regis">Don't Have An Account ? <span><a class="regis-link" href="/register">Register Here</a></span></p>
            </div>
        </form>
    </div>
    </div>
    <script>
        document.getElementById('login-btn').addEventListener('click', function () {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Gửi yêu cầu GET đến endpoint /api
            fetch('/api/account', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                },
            })
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                // Tìm tài khoản khớp với email và password
                const account = data.find(acc => acc.email === email && acc.password === password);
                if (account) {
                    document.getElementById('login-successfully').style.display = 'flex';
                    setTimeout(() => {
                        document.getElementById('login-successfully').style.display = 'none';
                        // Chuyển hướng dựa trên role
                        if (account.role === 'admin') {
                            //Đổi user trong localStorage
                            localStorage.setItem('user', JSON.stringify(account));
                            window.location.href = '/admin_movie';
                        } else {
                            localStorage.setItem('user', JSON.stringify(account));
                            window.location.href = '/home';
                        }
                    }, 2000);
                } else if (data.some(acc => acc.email === email)) {
                    document.getElementById('wrong-password').style.display = 'flex';
                    setTimeout(() => {
                        document.getElementById('wrong-password').style.display = 'none';
                    }, 2000);
                } else {
                    alert('Invalid credentials');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred');
            });
        });
    </script>
</body>

</html>
