<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,300;1,500;1,600;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style/login.css">
    <title>Movie Ticket Booking</title>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="title">Login to your account</div>
            <form>
                <label for="">
                    <div class="input-text">Email</div>
                    <input type="email" placeholder="Enter your email" id="email">
                </label>
                <label for="">
                    <div class="input-text">Password</div>
                    <input type="password" placeholder="Enter your password" id="password">
                    <p id="login-successfully" style="color: #1de782; font-size: 14px; display: none;">Đăng nhập thành công</p>
                    <p id="wrong-password" style="color: red; font-size: 14px; font-family: 'Poppins', sans-serif; display: none;">Sai mật khẩu. Vui lòng thử lại</p>
                </label>

                <div class="login-btn" id="login-btn">Login Now</div>
                <p class="regis">Don't Have An Account ? <span><a class="regis-link" href="register.html">Register Here</a></span></p>
                </div>
            </form>
        </div>
    </div>
<script>
    document.getElementById('login-btn').addEventListener('click', function() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);    
            if (key.startsWith('account_')) {
                const account =JSON.parse(localStorage.getItem(key));
                if (account.email === email && account.password === password) {
                    document.getElementById('login-successfully').style.display = 'flex';
                    setTimeout(function() {
                        document.getElementById('login-successfully').style.display = 'none';
                    }, 5000)
                    window.location.href = 'home2.html'
                    return;
                } else if (account.email === email && account.password !== password) {
                    document.getElementById('wrong-password').style.display = 'flex';
                    setTimeout(function() {
                        document.getElementById('wrong-password').style.display = 'none';
                    }, 3000)
                    return;
                }
            }
        }
    })
</script>
</body>
</html>
