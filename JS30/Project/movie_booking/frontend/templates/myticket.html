<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../style/myticket.css">
    <title>Movie Ticket Booking</title>
</head>

<style>
    body {
        background-image: url(/images/bg.png.png);
    }
</style>

<body>
    <div class="container">
        <header>
            <div class="logo-container"><a href="/home"><img src="/images/logo.png" alt=""></a></div>
            <div class="nav-container">
                <a href="/myticket" class="my-ticket">My Ticket</a>
                <a href="/" class="logout-btn">Logout</a>
            </div>
        </header>

        <div class="list-btn">
            <div class="btn active" id="upcoming">Upcoming</div>
            <div class="btn" id="history">History</div>
        </div>

        <div class="upcoming list" id="upcoming-list"></div>
        <div class="history list" id="history-list" style="display: none;">
            <!-- Ví dụ dữ liệu (sẽ được thay thế bởi API) -->
        </div>
    </div>

    <script>
        const upcomingList = document.getElementById('upcoming-list');
        const historyList = document.getElementById('history-list');
        const user = JSON.parse(localStorage.getItem('user'));

        // Kiểm tra nếu user không tồn tại
        if (!user || !user.email) {
            alert('Please log in to view your tickets!');
            window.location.href = '/login';
            throw new Error('No user data');
        }

        console.log('User email:', user.email);

        // Lấy danh sách vé từ API với email làm tham số
        fetch(`/api/tickets/${user.email}`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(tickets => {
            const today = new Date();
            today.setHours(0, 0, 0, 0); // Đặt về đầu ngày

            function parseTicketDate(dateStr) {
                // Giả định dateStr là "Fri, 2 December 2025", phân tích thủ công
                const [dayName, day, month, year] = dateStr.split(/,\s|\s/);
                return new Date(`${year}-${new Date(Date.parse(month + " 1, " + year)).getMonth() + 1}-${day.padStart(2, '0')}`);
            }

            if (!tickets || tickets.error) {
                alert(tickets.message || 'No tickets found.');
                return;
            }

            tickets.forEach(ticket => {
                const ticketDate = parseTicketDate(ticket.date);

                const ticketHTML = `
                    <div class="item">
                        <div class="date">
                            <div class="text">Date</div>
                            <p>${ticket.date}</p>
                        </div>
                        <div class="title">
                            <div class="text">Movie Title</div>
                            <p>${ticket.movie_title}</p>
                        </div>
                        <div class="ticket-time">
                            <div class="ticket">
                                <div class="text">Ticket (<span class="quantity">${ticket.ticket_seats.split(',').length}</span>)</div>
                                <p>${ticket.ticket_seats}</p>
                            </div>
                            <div class="time">
                                <div class="text">Hours</div>
                                <p>${calculateSecondToHours(ticket.hours)}</p>
                            </div>
                        </div>
                        <div class="download">Download Ticket</div>
                    </div>
                `;

                // So sánh ngày
                if (ticketDate < today) {
                    historyList.innerHTML += ticketHTML;
                } else {
                    upcomingList.innerHTML += ticketHTML;
                }
            });
        })
        .catch(error => {
            console.error('Error fetching tickets:', error);
            alert('Failed to load tickets. Please try again later.');
        });

        function calculateSecondToHours(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return `${hours}:${minutes}`;
        }
        // Xử lý chuyển đổi tab
        document.getElementById('upcoming').addEventListener('click', function () {
            document.getElementById('upcoming').classList.add('active');
            document.getElementById('history').classList.remove('active');
            document.getElementById('upcoming-list').style.display = 'flex';
            document.getElementById('history-list').style.display = 'none';
        });

        document.getElementById('history').addEventListener('click', function () {
            document.getElementById('history').classList.add('active');
            document.getElementById('upcoming').classList.remove('active');
            document.getElementById('history-list').style.display = 'flex';
            document.getElementById('upcoming-list').style.display = 'none';
        });
    </script>
</body>

</html>
