<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/register.css">
    <title>Movie Ticket Booking</title>
</head>

<style>
    .left-background {
        background-image: url(images/bg_signup_2.png);
    }
</style>

<body>
    <div class="left-background">
        <header>
            <div class="logo-container"><img src="/images/logo.png" alt=""></div>
        </header>
        <div class="para">Welcome. <br>
            Begin your cinematic adventure now with our ticketing platform!
        </div>
    </div>
    <div class="regis-site">
        <div class="login-container">
            <div class="title">Create an account</div>
            <form>
                <label for="">
                    <div class="input-text">Email</div>
                    <input type="email" placeholder="Enter your email" id="email">
                </label>
                <label for="" class="confirm">
                    <div class="input-text">Password</div>
                    <input type="password" placeholder="Enter your password" id="password">
                    <input type="password" placeholder="Confirm your password" id="checkagain">
                    <p id="wrong-password" style="color: red; font-size: 14px; font-family: 'Poppins', sans-serif; display: none;">Mật khẩu đã nhập không khớp. Vui lòng thử lại</p>
                    <p id="fill-input" style="color: red; font-size: 14px; font-family: 'Poppins', sans-serif; display: none;">Vui lòng nhập đầy đủ thông tin</p>
                    <p id="already-exist" style="color: red; font-size: 14px; font-family: 'Poppins', sans-serif; display: none;">Email này đã được đăng ký. Vui lòng dùng email khác.</p>
                    <p id="login-successfully" style="color: green; font-size: 14px; font-family: 'Poppins', sans-serif; display: none;">Đăng ký thành công! Đang chuyển hướng...</p>
                </label>
                <div class="login-btn" id="login-btn">Create Account</div>
                <p class="regis">Already Have An Account ? <span><a class="log-link" href="/login">Log In</a></span></p>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('login-btn').addEventListener('click', function (event) {
            event.preventDefault(); // Ngăn form submit mặc định
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const check = document.getElementById('checkagain').value.trim();

            if (email === "" || password === "" || check === "") {
                document.getElementById('fill-input').style.display = 'flex';
                setTimeout(() => {
                    document.getElementById('fill-input').style.display = 'none';
                }, 2000);
                return;
            }

            if (password !== check) {
                document.getElementById('wrong-password').style.display = 'flex';
                setTimeout(() => {
                    document.getElementById('wrong-password').style.display = 'none';
                }, 2000);
                return;
            }

            fetch('/api/account', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password }),
            })
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                if (data.message === "Đã thêm thành công") {
                    document.getElementById('login-successfully').style.display = 'flex';
                    setTimeout(() => {
                        document.getElementById('login-successfully').style.display = 'none';
                        window.location.href = "/login";
                    }, 3000);
                } else if (data.error) {
                    if (data.error.includes("Duplicate entry")) {
                        document.getElementById('already-exist').style.display = 'flex';
                        setTimeout(() => {
                            document.getElementById('already-exist').style.display = 'none';
                        }, 3000);
                    } else {
                        alert('An error occurred: ' + data.error);
                    }
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred');
            });
        });
    </script>
</body>

</html>
