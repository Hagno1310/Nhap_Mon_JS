            <div class="x-seat">X</div>

        <footer>
            <div class="total info">
                <div class="title">Total</div>
                <div class="text">RM <span id="total-price">00.00</span></div>
            </div>
            <div class="total-seat info">
                <div class="title">Seat</div>
                <div id="seat-display" class="text">No Seat</div>
            </div>

            <div class="btn-place">
                <div class="back-btn btn">Back</div>
                <div class="payment btn" id="btn">Proceed Payment</div>
            </div>
        </footer>
    </div>



    <script>
        var row = ['A', 'B', 'C', 'D', 'E', 'G']
        var rowIndex = 0
        var indexCurrent = 1
        var numberSeat = 1
        var price = 18.95
        const selectedSeats = [];

        // Lấy thông tin từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const theater = urlParams.get('theater');
        const date = urlParams.get('date');
        const time = urlParams.get('time');
        const movie = urlParams.get('movie');
        const image = urlParams.get('image');

        // Hiển thị thông tin trong footer
        document.getElementById('seats').querySelectorAll('.seat').forEach(e => {
            e.textContent = `${row[rowIndex]}${numberSeat}`
            indexCurrent++
            numberSeat++

            if (indexCurrent == 11) {
                indexCurrent = 1
                rowIndex++
            }

            if (numberSeat == 11) {
                numberSeat = 1
            }

            e.addEventListener('click', function () {
                const seatLabel = e.innerText;

                e.classList.toggle('active')

                if (e.classList.contains('active')) {
                    if (!selectedSeats.includes(seatLabel)) {
                        // Thêm ghế vào danh sách đã chọn
                        selectedSeats.push(seatLabel);
                    }
                } else {
                    // Xóa ghế khỏi danh sách đã chọn
                    const index = selectedSeats.indexOf(seatLabel);
                    if (index !== -1) {
                        selectedSeats.splice(index, 1);
                    }
                }

                document.getElementById('seat-display').textContent = selectedSeats.join(', ');

                if (selectedSeats.length == 0) {
                    document.getElementById('seat-display').textContent = 'No Seat'
                }

                var count = document.querySelectorAll('.seat.active').length;
                document.getElementById('total-price').textContent = `${(count * price).toFixed(2)}`

                console.log(e.textContent)

            })

            document.querySelector('.back-btn').addEventListener('click', function () {
                window.location.href = '/home'
            })
        })  

        document.getElementById('btn').addEventListener('click', function () {
            if (selectedSeats.length > 0) {
                const totalPrice = (selectedSeats.length * price).toFixed(2);
                window.location.href = `detail?theater=${encodeURIComponent(theater)}&date=${encodeURIComponent(date)}&time=${encodeURIComponent(time)}&movie=${encodeURIComponent(movie)}&image=${encodeURIComponent(image)}&seats=${encodeURIComponent(selectedSeats.join(', '))}&total=${encodeURIComponent(totalPrice)}`;
            } else {
                alert('Vui lòng chọn ít nhất một ghế!');
            }
        });

    </script>
